name: Cypress in Docker

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec/glob to run'
        required: false
        default: 'cypress/e2e/qauto-forstudy-reg/registration.cy.js'
      browser:
        description: 'Browser to run (chrome, firefox, electron)'
        required: false
        default: ''

jobs:
  cypress:
    runs-on: ubuntu-latest
    env:
      SPEC: ${{ github.event.inputs.spec }}
      BROWSER: ${{ github.event.inputs.browser }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Cache npm
        uses: actions/cache@v4.2.4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Pull Cypress Docker image 15.2.0
        run: docker pull cypress/included:15.2.0

      - name: Run Cypress inside Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/e2e \
            -v "$HOME/.npm":/root/.npm \
            -e SPEC="$SPEC" \
            -e BROWSER="$BROWSER" \
            -w /e2e \
            --ipc=host \
            --entrypoint /bin/bash \
            cypress/included:15.2.0 \
            -lc 'npm ci >/dev/null 2>&1 \
            && cypress verify >/dev/null 2>&1 \
            && if [ -z "${SPEC}" ]; then SPEC="cypress/e2e/qauto-forstudy-reg/registration.cy.js"; fi \
            && if [ -n "${BROWSER}" ]; then BROWSER_ARG="--browser ${BROWSER}"; else BROWSER_ARG=""; fi \
            && set -o pipefail \
            && cypress run -q --spec "${SPEC}" ${BROWSER_ARG} 2>&1 \
              | grep -v -E "Failed to connect to the bus|Automatic fallback to software WebGL has been deprecated|on.cypress.io/cloud-get-started"; \
            exit ${PIPESTATUS[0]}'

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cypress-videos
          path: cypress/videos/**
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cypress-screenshots
          path: cypress/screenshots/**
          if-no-files-found: ignore

      - name: Upload reports (if any)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cypress-reports
          path: cypress/reports/**
          if-no-files-found: ignore
